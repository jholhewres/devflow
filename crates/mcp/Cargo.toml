[package]
name = "devflow-mcp"
description = "devflow as an MCP server for any agent CLI or IDE, and the few commands that set it up."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "../../README.md"

[[bin]]
name = "devflow"
path = "src/main.rs"

[dependencies]
serde_json.workspace = true
devflow-engine.workspace = true
clap.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
# A project's cache folder and a session's streak file are named by a hash.
sha2 = "0.10"
# Decisions over HTTPS, blocking, with rustls: no OpenSSL to link.
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
# A release's tar.gz, read in this process: no `tar` on PATH needed.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = { version = "0.4", default-features = false }

[dev-dependencies]
tempfile.workspace = true
