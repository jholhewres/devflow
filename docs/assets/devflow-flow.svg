<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-labelledby="t d">
  <title id="t">The devflow flow</title>
  <desc id="d">Six stages: briefing, context, plan, execution, review, completion. Completion is a gate: the work is done only when checks are green after the last change, every acceptance criterion is proven and the review has no blocking findings.</desc>
  <style>
    :root { --fg: #1f1f1f; --muted: #6b6b6b; --line: #d6d2cb; --box: #ffffff; --panel: #f6f4f0; --accent: #ec6f33; --on-accent: #ffffff; }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #ececec; --muted: #9da3ab; --line: #3a3f47; --box: #161b22; --panel: #11161d; --accent: #f0844c; --on-accent: #111111; }
    }
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--fg); }
    .num { font-size: 11px; font-weight: 600; fill: var(--accent); letter-spacing: .08em; }
    .stage { font-size: 15px; font-weight: 600; }
    .muted { font-size: 13px; fill: var(--muted); }
    .item { font-size: 14px; }
    .box { fill: var(--box); stroke: var(--line); stroke-width: 1.5; }
    .hot { fill: var(--box); stroke: var(--accent); stroke-width: 2; }
    .panel { fill: var(--panel); stroke: var(--line); stroke-width: 1.5; }
    .arrow { stroke: var(--muted); stroke-width: 1.75; fill: none; }
    .head { fill: var(--muted); }
    .ahead { fill: var(--accent); }
    .acc { stroke: var(--accent); stroke-width: 2; fill: none; }
    .tick { stroke: var(--accent); stroke-width: 2.25; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .done { fill: var(--accent); }
    .done-text { font-size: 16px; font-weight: 700; fill: var(--on-accent); }
    .done-tick { stroke: var(--on-accent); stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 8 4 0 8z" class="head"/></marker>
    <marker id="b" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 8 4 0 8z" class="ahead"/></marker>
  </defs>

  <!-- Stages -->
  <g>
    <rect class="box" x="26" y="40" width="128" height="56" rx="10"/>
    <text class="num" x="42" y="61">01</text><text class="stage" x="42" y="83">briefing</text>
    <rect class="box" x="182" y="40" width="128" height="56" rx="10"/>
    <text class="num" x="198" y="61">02</text><text class="stage" x="198" y="83">context</text>
    <rect class="box" x="338" y="40" width="128" height="56" rx="10"/>
    <text class="num" x="354" y="61">03</text><text class="stage" x="354" y="83">plan</text>
    <rect class="box" x="494" y="40" width="128" height="56" rx="10"/>
    <text class="num" x="510" y="61">04</text><text class="stage" x="510" y="83">execution</text>
    <rect class="box" x="650" y="40" width="128" height="56" rx="10"/>
    <text class="num" x="666" y="61">05</text><text class="stage" x="666" y="83">review</text>
    <rect class="hot" x="806" y="40" width="128" height="56" rx="10"/>
    <text class="num" x="822" y="61">06</text><text class="stage" x="822" y="83">completion</text>
  </g>
  <g marker-end="url(#a)">
    <path class="arrow" d="M157 68h20"/>
    <path class="arrow" d="M313 68h20"/>
    <path class="arrow" d="M469 68h20"/>
    <path class="arrow" d="M625 68h20"/>
    <path class="arrow" d="M781 68h20"/>
  </g>

  <!-- Completion, expanded -->
  <path class="acc" d="M870 96v44" stroke-dasharray="4 4"/>
  <rect class="panel" x="26" y="140" width="908" height="166" rx="14"/>
  <text class="muted" x="50" y="170">done only when the evidence proves it</text>

  <g>
    <circle cx="60" cy="208" r="10" class="acc"/><path class="tick" d="M55 208l3.5 3.5 6.5-7"/>
    <text class="item" x="80" y="213">checks green after the last change</text>
    <circle cx="60" cy="240" r="10" class="acc"/><path class="tick" d="M55 240l3.5 3.5 6.5-7"/>
    <text class="item" x="80" y="245">every acceptance criterion proven</text>
    <circle cx="60" cy="272" r="10" class="acc"/><path class="tick" d="M55 272l3.5 3.5 6.5-7"/>
    <text class="item" x="80" y="277">review with no blocking findings</text>
  </g>

  <path class="arrow" d="M352 208c40 0 40 32 80 32M352 272c40 0 40 -32 80 -32M352 240h80" marker-end="url(#a)"/>

  <rect class="hot" x="440" y="212" width="150" height="56" rx="10"/>
  <path class="acc" d="M487 226v28M497 226v28"/>
  <text class="stage" x="509" y="245">gate</text>
  <text class="muted" x="515" y="290" text-anchor="middle">end of every turn</text>

  <path class="arrow" d="M594 240h156" marker-end="url(#b)" style="stroke: var(--accent)"/>

  <rect class="done" x="760" y="212" width="150" height="56" rx="28"/>
  <path class="done-tick" d="M798 240l7 7 13-14"/>
  <text class="done-text" x="828" y="246">done</text>
</svg>
