<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-labelledby="t d">
  <title id="t">The devflow flow</title>
  <desc id="d">Six stages and what each hands the next: briefing writes the brief, approved by the person; context gathers the glossary and decisions; plan makes work items with acceptance criteria, approved by the person; execution builds them test first and runs the checks as evidence; review gets findings from headless reviewers; completion is the gate. Done only when checks are green after the last change, every criterion is proven and the review blocks nothing.</desc>
  <style>
    :root { --fg: #1f1f1f; --muted: #6b6b6b; --line: #d6d2cb; --box: #ffffff; --panel: #f6f4f0; --accent: #ec6f33; --on-accent: #ffffff; }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #ececec; --muted: #9da3ab; --line: #3a3f47; --box: #161b22; --panel: #11161d; --accent: #f0844c; --on-accent: #111111; }
    }
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--fg); }
    .num { font-size: 11px; font-weight: 600; fill: var(--accent); letter-spacing: .08em; }
    .stage { font-size: 15px; font-weight: 600; }
    .muted { font-size: 13px; fill: var(--muted); }
    .item { font-size: 14px; }
    .line { font-size: 12.5px; fill: var(--muted); }
    .yes { font-size: 11px; font-weight: 600; fill: var(--accent); }
    .box { fill: var(--box); stroke: var(--line); stroke-width: 1.5; }
    .hot { fill: var(--box); stroke: var(--accent); stroke-width: 2; }
    .panel { fill: var(--panel); stroke: var(--line); stroke-width: 1.5; }
    .arrow { stroke: var(--muted); stroke-width: 1.75; fill: none; }
    .head { fill: var(--muted); }
    .ahead { fill: var(--accent); }
    .acc { stroke: var(--accent); stroke-width: 2; fill: none; }
    .tick { stroke: var(--accent); stroke-width: 2.25; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .done { fill: var(--accent); }
    .done-text { font-size: 16px; font-weight: 700; fill: var(--on-accent); }
    .done-tick { stroke: var(--on-accent); stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 8 4 0 8z" class="head"/></marker>
    <marker id="b" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 8 4 0 8z" class="ahead"/></marker>
  </defs>

  <rect class="box" x="16" y="36" width="148" height="112" rx="10"/>
  <text class="num" x="30" y="58">01</text><text class="stage" x="30" y="80">briefing</text>
  <text class="line" x="30" y="108">the brief: goal,</text><text class="line" x="30" y="126">success, out of scope</text>
  <path class="acc" d="M166 92.0h10" marker-end="url(#b)"/>
  <text class="yes" x="172.0" y="26" text-anchor="middle">your yes</text>
  <path class="acc" d="M172.0 30v52.0" stroke-dasharray="3 3"/>
  <rect class="box" x="180" y="36" width="148" height="112" rx="10"/>
  <text class="num" x="194" y="58">02</text><text class="stage" x="194" y="80">context</text>
  <text class="line" x="194" y="108">glossary, ADRs,</text><text class="line" x="194" y="126">what already exists</text>
  <path class="arrow" d="M330 92.0h10" marker-end="url(#a)"/>
  <rect class="box" x="344" y="36" width="148" height="112" rx="10"/>
  <text class="num" x="358" y="58">03</text><text class="stage" x="358" y="80">plan</text>
  <text class="line" x="358" y="108">work items with</text><text class="line" x="358" y="126">acceptance criteria</text>
  <path class="acc" d="M494 92.0h10" marker-end="url(#b)"/>
  <text class="yes" x="500.0" y="26" text-anchor="middle">your yes</text>
  <path class="acc" d="M500.0 30v52.0" stroke-dasharray="3 3"/>
  <rect class="box" x="508" y="36" width="148" height="112" rx="10"/>
  <text class="num" x="522" y="58">04</text><text class="stage" x="522" y="80">execution</text>
  <text class="line" x="522" y="108">tests first; checks</text><text class="line" x="522" y="126">run as evidence</text>
  <path class="arrow" d="M658 92.0h10" marker-end="url(#a)"/>
  <rect class="box" x="672" y="36" width="148" height="112" rx="10"/>
  <text class="num" x="686" y="58">05</text><text class="stage" x="686" y="80">review</text>
  <text class="line" x="686" y="108">headless reviewers,</text><text class="line" x="686" y="126">findings by severity</text>
  <path class="arrow" d="M822 92.0h10" marker-end="url(#a)"/>
  <rect class="hot" x="836" y="36" width="148" height="112" rx="10"/>
  <text class="num" x="850" y="58">06</text><text class="stage" x="850" y="80">completion</text>
  <text class="line" x="850" y="108">gate: evidence after</text><text class="line" x="850" y="126">the last change</text>
  <rect class="panel" x="16" y="180" width="968" height="96" rx="14"/>
  <text class="muted" x="40" y="208">done only when the evidence proves it</text>
  <circle cx="50" cy="242" r="10" class="acc"/><path class="tick" d="M45 242l3.5 3.5 6.5-7"/>
  <text class="item" x="68" y="247">checks green after the last change</text>
  <circle cx="326" cy="242" r="10" class="acc"/><path class="tick" d="M321 242l3.5 3.5 6.5-7"/>
  <text class="item" x="344" y="247">every criterion proven</text>
  <circle cx="546" cy="242" r="10" class="acc"/><path class="tick" d="M541 242l3.5 3.5 6.5-7"/>
  <text class="item" x="564" y="247">nothing blocking in review</text>
  <path class="acc" d="M910.0 148v32" stroke-dasharray="4 4"/>
  <rect class="done" x="810" y="216" width="150" height="50" rx="25"/>
  <path class="done-tick" d="M848 241l7 7 13-14"/>
  <text class="done-text" x="878" y="247">done</text>
</svg>
