[workspace]
resolver = "2"
members = ["crates/core", "crates/cli"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.93"
license = "Apache-2.0"
repository = "https://github.com/jholhewres/stagegate"
homepage = "https://github.com/jholhewres/stagegate"
authors = ["Jhol Hewres"]

[workspace.dependencies]
stagegate-core = { path = "crates/core", version = "0.0.1" }
clap = { version = "4.6", features = ["derive"] }
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
